<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>导入 Source Control 到 Scripting</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #000;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 90vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
      text-align: center;
    }
    .card {
      background: #1c1c1e;
      padding: 30px 24px;
      border-radius: 20px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 8px 30px rgba(0,0,0,0.5);
    }
    .icon {
      font-size: 54px;
      margin-bottom: 12px;
    }
    h1 {
      font-size: 22px;
      margin: 0 0 8px;
    }
    p {
      color: #8e8e93;
      font-size: 14px;
      line-height: 1.5;
      margin: 0 0 24px;
    }
    .btn {
      display: block;
      background: #5856d6;
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      padding: 14px 20px;
      border-radius: 14px;
      font-size: 16px;
      transition: opacity 0.2s;
    }
    .btn:active {
      opacity: 0.8;
    }
    .manual {
      margin-top: 20px;
      font-size: 12px;
      color: #636366;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🌿</div>
    <h1>导入 Source Control 到 Scripting</h1>
    <p>正在尝试自动呼起 Scripting 下载安装并导入项目...</p>
    <a id="importBtn" class="btn" href="scripting://import_scripts?urls=%5B%22https%3A%2F%2Fgithub.com%2FJiangWeiQAQ%2FSource-Control%2Farchive%2Frefs%2Fheads%2Fmaster.zip%22%5D">点击直接呼起导入</a>
    <div class="manual">若未自动跳转，请点击上方紫色按钮</div>
  </div>

  <script>
    const targetScheme = "scripting://import_scripts?urls=%5B%22https%3A%2F%2Fgithub.com%2FJiangWeiQAQ%2FSource-Control%2Farchive%2Frefs%2Fheads%2Fmaster.zip%22%5D";
    window.onload = function() {
      setTimeout(function() {
        window.location.href = targetScheme;
      }, 500);
    };
  </script>
</body>
</html>
